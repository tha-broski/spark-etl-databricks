resources:
  jobs:
    spark_etl_ecommerce:
      name: spark-etl-ecommerce

      tasks:
        - task_key: tests
          spark_python_task:
            python_file: ../src/run_tests.py
          environment_key: default

        - task_key: precheck
          depends_on:
            - task_key: tests
          spark_python_task:
            python_file: ../src/precheck.py
          environment_key: default

        - task_key: etl_pipeline
          depends_on:
            - task_key: precheck
          spark_python_task:
            python_file: ../src/main.py
          environment_key: default

          max_retries: 1
          min_retry_interval_millis: 180000

          disable_auto_optimization: true
        - task_key: postcheck
          depends_on:
            - task_key: etl_pipeline
          spark_python_task:
            python_file: ../src/postcheck.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "2"
            dependencies:
              - pytest
              - ../dist/*.whl

      schedule:
        quartz_cron_expression: "0 0 8 * * ?"
        timezone_id: "Europe/Warsaw"
        pause_status: UNPAUSED
