name: Databricks CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-vesrion: "17"
      - name: Install dependencies
        run: pip instal; -r requirements.txt
      - name: Install project
        run: pip install.
      - name: Run CI tests
        run: pytest -q tests/transformations tests/quality tests/gold
